
[project]
name = "OnlineTSF"
dynamic = ["version"]
description = "An online time series forecasting framework"
readme = "README.md"
authors = [
    { name = "Lifan Zhao", email = "mogician233@sjtu.edu.cn" }
]
license = "Apache-2.0"
keywords = ["time series forecasting", "online learning"]
classifiers = [
    "Development Status :: 1 - Planning Copy",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Operating System :: OS Independent",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.10"
dependencies = [
    "torch>=2.10,<2.11",
    "transformers[torch]>=4.57.6,<5",
    "numpy<3",
    "matplotlib",
    "pandas>=2.3.3,<4",
    "scikit-learn<1.8",
    "datasets",
    "urllib3>=1.26.19", # see https://github.com/urllib3/urllib3/security/advisories/GHSA-34jh-p97f-mpxf
    "pprintpp",
    "deprecated",
    "filelock>=3.20.3",  
    "einops>=0.7",
    "jupyter",
    "ipywidgets",
    "plotly",
    "kaleido",
    "tensorboard",

    "granite-tsfm==0.3.6",
]
[tool.setuptools]
py-modules = []